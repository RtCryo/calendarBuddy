schema: spec-driven

context: |
  calendarBuddy is a homeBuddy service: a family calendar with its own authentication,
  family member profiles, and appointments per member. It mirrors the finanzBuddy stack
  (Spring Boot 4 / Java 25 / Liquibase / PostgreSQL backend, React 19 / TypeScript 7 /
  Vite / Tailwind 4 / Vitest / oxlint UI, Docker Compose with Traefik) and the finanzBuddy
  UI design system anatomy, with its own color palette and brand.
  User-facing copy is concise English in sentence case.
