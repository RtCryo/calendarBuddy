name: Calendar UI
on:
  push:
    paths: ['ui/**', '.github/workflows/ui.yml']
  pull_request:
    paths: ['ui/**', '.github/workflows/ui.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        working-directory: ui
        run: npm ci
      - name: Test
        working-directory: ui
        run: npm run test
      - name: Lint
        working-directory: ui
        run: npm run lint
      - name: Build
        working-directory: ui
        run: npm run build
