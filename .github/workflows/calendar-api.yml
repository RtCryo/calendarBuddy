name: Calendar API
on:
  push:
    paths: ['calendar-api/**', '.github/workflows/calendar-api.yml']
  pull_request:
    paths: ['calendar-api/**', '.github/workflows/calendar-api.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: calendar-api/pom.xml
      - name: Test with PostgreSQL Testcontainers
        working-directory: calendar-api
        run: ./mvnw verify
