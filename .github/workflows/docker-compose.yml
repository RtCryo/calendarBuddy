name: Compose configuration
on:
  push:
    paths: ['docker-compose*.yml', '.github/workflows/docker-compose.yml']
  pull_request:
    paths: ['docker-compose*.yml', '.github/workflows/docker-compose.yml']
jobs:
  config:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-local-password
      CALENDAR_DOMAIN: calendar.example.com
      TRAEFIK_ACME_EMAIL: ci@example.com
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose
        run: docker compose config --quiet
