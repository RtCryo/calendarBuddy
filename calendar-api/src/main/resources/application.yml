spring:
  application:
    name: calendar-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:calendarbuddy}
    username: ${DB_USER:calendarbuddy}
    password: ${DB_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.xml
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  # Tracing (root capability homebuddy-tracing). The OTLP endpoint is set only by Compose
  # (MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT); without it no span is exported.
  tracing:
    sampling:
      # Boot's default is 0.1. Overridden by MANAGEMENT_TRACING_SAMPLING_PROBABILITY.
      probability: 1.0
  opentelemetry:
    resource-attributes:
      service.name: calendarbuddy-calendar-api
      service.namespace: calendarbuddy
  # The OpenTelemetry starter also brings OTLP metrics and log export. Metrics are scraped by
  # Prometheus and logs collected from Docker, so both stay off.
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
app:
  auth:
    jwks-uri: ${AUTH_JWKS_URI:http://auth:8080/.well-known/jwks.json}
    issuer: ${AUTH_ISSUER:homebuddy-auth}
    audience: ${AUTH_AUDIENCE:calendarbuddy}
