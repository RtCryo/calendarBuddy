spring:
  application:
    name: calendar-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:calendarbuddy}
    username: ${DB_USER:calendarbuddy}
    password: ${DB_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.xml
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
app:
  auth:
    jwks-uri: ${AUTH_JWKS_URI:http://auth:8080/.well-known/jwks.json}
    issuer: ${AUTH_ISSUER:homebuddy-auth}
    audience: ${AUTH_AUDIENCE:calendarbuddy}
