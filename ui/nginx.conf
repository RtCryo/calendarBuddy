server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /api { return 308 /api/; }

    # Resolve authBuddy lazily so the UI still starts (and shows a clear sign-in error) while it is down.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/auth/ {
        set $auth_upstream http://auth:8080;
        rewrite ^/api/auth/(.*)$ /auth/$1 break;
        proxy_pass $auth_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://calendar-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location / { try_files $uri $uri/ /index.html; }
}
